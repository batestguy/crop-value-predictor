name: FEWS v3 canary (evidence only)

on:
  workflow_dispatch:
    inputs:
      cutoff_month:
        description: Latest complete month for evidence labeling (YYYY-MM)
        required: true
        type: string
        default: '2026-08'
      start_date:
        description: FEWS canary start date (YYYY-MM-DD)
        required: true
        type: string
        default: '2026-08-01'
      end_date:
        description: FEWS canary end date (YYYY-MM-DD)
        required: true
        type: string
        default: '2026-08-31'
      page_size:
        description: Bounded FEWS page size (1-100)
        required: true
        type: string
        default: '25'

permissions:
  contents: read

concurrency:
  group: fews-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Retrieve bounded FEWS v3 evidence
        shell: bash
        env:
          CUTOFF_MONTH: ${{ inputs.cutoff_month }}
          CANARY_START: ${{ inputs.start_date }}
          CANARY_END: ${{ inputs.end_date }}
          CANARY_PAGE_SIZE: ${{ inputs.page_size }}
        run: |
          set -o pipefail
          python pipeline/source_audit.py --fetch --fews-canary \
            --cutoff-month "$CUTOFF_MONTH" \
            --canary-start "$CANARY_START" \
            --canary-end "$CANARY_END" \
            --canary-page-size "$CANARY_PAGE_SIZE" \
            --canary-timeout-seconds 10 \
            --output-dir audit-output-fews-canary \
            2>&1 | tee fews-canary.log
      - name: Upload FEWS canary evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fews-canary-${{ github.run_id }}
          path: |
            audit-output-fews-canary
            fews-canary.log
          if-no-files-found: warn
          retention-days: 30
