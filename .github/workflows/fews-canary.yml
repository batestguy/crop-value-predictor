name: FEWS static export canary (evidence only)

on:
  workflow_dispatch:
    inputs:
      cutoff_month:
        description: Latest complete month for evidence labeling (YYYY-MM)
        required: true
        type: string
        default: '2026-08'
      timeout_seconds:
        description: Bounded static discovery/download timeout (1-30 seconds)
        required: true
        type: string
        default: '30'

permissions:
  contents: read

concurrency:
  group: fews-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Retrieve official FEWS static export evidence
        shell: bash
        env:
          CUTOFF_MONTH: ${{ inputs.cutoff_month }}
          CANARY_TIMEOUT: ${{ inputs.timeout_seconds }}
        run: |
          set -o pipefail
          python pipeline/source_audit.py --fetch --fews-static-canary \
            --cutoff-month "$CUTOFF_MONTH" \
            --canary-timeout-seconds "$CANARY_TIMEOUT" \
            --output-dir audit-output-fews-canary \
            2>&1 | tee fews-canary.log
      - name: Upload FEWS canary evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fews-canary-${{ github.run_id }}
          path: |
            audit-output-fews-canary
            fews-canary.log
          if-no-files-found: warn
          retention-days: 30
