name: Refresh static snapshot

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python pipeline/validate.py
      # Source adapters and audited snapshot generation are added after Stage 1.
      # A failed audit never replaces the last known-good public snapshot.
