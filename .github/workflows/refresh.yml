name: Refresh static snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python pipeline/validate.py | tee snapshot-validation.txt
      # Source adapters and audited snapshot generation are added after Stage 1.
      # This workflow is validation-only and never replaces the last known-good snapshot.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-validation-${{ github.sha }}
          path: snapshot-validation.txt
          retention-days: 30
